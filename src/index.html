<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanBuzz Coffee & Bistro - Restaurant Management System</title>
    <meta name="description" content="BeanBuzz Coffee & Bistro - Premium coffee and fresh cuisine with efficient restaurant management system">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-coffee"></i>
                    <span>BeanBuzz RMS</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Navigation will be populated by JavaScript based on user role -->
            </nav>
            
            <div class="sidebar-footer" id="sidebarFooter">
                <!-- User info and logout will be populated by JavaScript -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <div class="page-content" id="pageContent">
                <!-- Page content will be loaded here -->
                <div class="loading">
                    <i class="fas fa-coffee fa-spin"></i>
                    <p>Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
